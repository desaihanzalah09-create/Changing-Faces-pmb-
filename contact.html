<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Contact Us | Changing Faces</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/Logo.jpeg">
  <link rel="icon" type="image/png" sizes="16x16" href="images/Logo.jpeg">
  <link rel="apple-touch-icon" sizes="180x180" href="images/Logo.jpeg">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="header">
    <div class="nav-container">
      <a href="index.html" class="logo-brand">
        <img src="images/Logo.jpeg" alt="Changing Faces logo" class="site-logo">
        <span class="brand-name">Changing <span class="teal-text">Faces</span></span>
      </a>
      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
      </ul>
      <a href="https://wa.me/27677862277?text=Hi%20Changing%20Faces%2C%20I%20would%20like%20to%20make%20an%20inquiry." class="btn-gold">Book Appointment</a>
    </div>
  </header>

  <section class="hero">
    <h1 class="hero-title">Get In <span class="teal-text">Touch</span></h1>
    <p class="hero-subtitle">Have questions or want to reach out directly? Send us a message below.</p>
  </section>

  <main class="container" style="max-width: 800px;">
    <form class="card" id="inquiry-form">
      <div class="form-group">
        <label style="display:block; margin-bottom:8px; color:var(--text-muted);">Your Name</label>
        <input type="text" class="form-control" id="inquiry-name" placeholder="Full name" required>
      </div>

      <div class="form-group">
        <label style="display:block; margin-bottom:8px; color:var(--text-muted);">Email Address / Contact No</label>
        <input type="text" class="form-control" id="inquiry-contact" placeholder="Email or Phone Number" required>
      </div>

      <div class="form-group">
        <label style="display:block; margin-bottom:8px; color:var(--text-muted);">Message</label>
        <textarea class="form-control" id="inquiry-message" rows="5" placeholder="How can we assist you today?" required></textarea>
      </div>

      <button type="submit" class="btn-primary" style="width: 100%;">Send Inquiry</button>
    </form>
  </main>

  <footer class="footer">
    <div class="footer-bottom">
      <p>&copy; 2026 Changing Faces Lounge. All rights reserved.</p>
    </div>
  </footer>

  <script>
    document.getElementById('inquiry-form').addEventListener('submit', function(event) {
      event.preventDefault();

      const name = document.getElementById('inquiry-name').value.trim();
      const contact = document.getElementById('inquiry-contact').value.trim();
      const message = document.getElementById('inquiry-message').value.trim();
      const whatsappMessage = `Hi Changing Faces, I would like to send an inquiry.\nName: ${name}\nContact: ${contact}\nMessage: ${message}`;

      window.location.href = `https://wa.me/27677862277?text=${encodeURIComponent(whatsappMessage)}`;
    });
  </script>

</body>
</html>
